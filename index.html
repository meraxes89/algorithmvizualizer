<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive Algorithm Visualizer — learn sorting, searching, graph, pathfinding and tree algorithms step by step." />
    <title>Algorithm Visualizer</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('av-theme');
          var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <!-- Fonts are self-hosted via @fontsource packages imported from
         src/index.css — same origin, discovered in the render-blocking
         stylesheet. The old async Google Fonts pattern applied (and swapped)
         web fonts after first paint, which was the layout-shift source on
         slow networks and flaked the CI Lighthouse budget. -->
  </head>
  <body>
    <!-- Ambient mesh background: static HTML so it is present at first
         paint. Mounting it from React (~300ms in) inserted a full-viewport
         pseudo-element and registered a 0.155 layout shift on every load. -->
    <div class="bg-ambient" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
