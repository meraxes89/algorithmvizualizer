name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Layer boundaries, unused code and import cycles.
      - run: pnpm lint

      # Strict TypeScript over the typed surface.
      - run: pnpm typecheck

      # Unit and component tests, with the coverage gate on the typed surface.
      - run: pnpm test:coverage

  build:
    name: build · bundle budget
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          GITHUB_PAGES: 'true'

      # Fails the PR when a chunk grows past its budget.
      - run: pnpm size

  a11y:
    name: a11y · axe route sweep
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The preview server runs at the root, so this build skips the
      # GitHub Pages base path that the deploy build uses.
      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm e2e

  lighthouse:
    name: lighthouse · route budgets
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The preview server runs at the root, so this build skips the
      # GitHub Pages base path that the deploy build uses.
      - run: pnpm build

      # Lighthouse drives a real Chrome; reuse the Playwright-managed
      # binary the a11y job already installs.
      - run: pnpm exec playwright install --with-deps chromium

      - name: Resolve the Playwright Chromium binary
        run: |
          echo "CHROME_PATH=$(find "$HOME/.cache/ms-playwright" -type f -name chrome | head -n 1)" >> "$GITHUB_ENV"

      - name: Serve the production build
        run: |
          pnpm preview --port 4173 --strictPort &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173/ > /dev/null; then
              echo "preview server is up"
              exit 0
            fi
            sleep 1
          done
          echo "preview server did not start"
          exit 1

      - name: Run Lighthouse against the home route
        run: |
          mkdir -p lighthouse-reports
          pnpm dlx lighthouse@12 http://localhost:4173/ \
            --output=json \
            --output-path=lighthouse-reports/home.json \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" \
            --quiet

      # Fails the PR when a category drops under its budget.
      - name: Assert the category budgets
        run: node tools/lighthouse-budget.mjs lighthouse-reports/home.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-reports/
          retention-days: 7
