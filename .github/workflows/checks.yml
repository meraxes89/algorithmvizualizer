name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Layer boundaries, unused code and import cycles.
      - run: pnpm lint

      # Strict TypeScript over the typed surface.
      - run: pnpm typecheck

      # Unit and component tests, with the coverage gate on the typed surface.
      - run: pnpm test:coverage

  build:
    name: build · bundle budget
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          GITHUB_PAGES: 'true'

      # Fails the PR when a chunk grows past its budget.
      - run: pnpm size

  a11y:
    name: a11y · axe route sweep
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The preview server runs at the root, so this build skips the
      # GitHub Pages base path that the deploy build uses.
      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm e2e
